status=error
name=LOGGERS
property.basePath=logs
appender.console.type=Console
appender.console.name=LogToConsole
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=[%-5level] %d{yyyy-MM-dd HH:mm:SSS} %c{1}:%L - %msg%n

appender.file.type=file
appender.file.name=LogToFile
appender.file.filename=${basePath}/automation.log
appender.file.layout.type=PatternLayout
appender.file.layout.pattern=[%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} %c{1}:%L - %msg%n

rootLogger.level=debug
rootLogger.appenderRef.stdout.ref=LogToConsole
rootLogger.appenderRef.rolling.ref=LogToFile